name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: UTC   # JST依存のロジックが残っていないことを検出する
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run items:check
      - run: npm run version:check
      - run: node scripts/check-static.mjs
      - run: npm test

  verify-jst:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  deploy:
    needs: [verify, verify-jst]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 配信物を組み立てる（開発用のものを除く）
        # app/ には開発用のものが同居している。そのまま上げると
        # テスト・devサーバー・検討用モックまで公開されてしまう。
        run: |
          mkdir -p dist
          cp -r app/. dist/
          rm -rf dist/__mock dist/tests
          rm -f dist/dev-server.mjs
          echo "配信するもの:"; ls dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
